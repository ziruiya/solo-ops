name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11
        # CI ephemeral only; this is a disposable workflow database credential.
        env:
          MARIADB_ROOT_PASSWORD: soloops_ci_only
          MARIADB_DATABASE: soloops
          MARIADB_USER: soloops
          MARIADB_PASSWORD: soloops_ci_only
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate:fresh --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: soloops
          DB_USERNAME: soloops
          DB_PASSWORD: soloops_ci_only
      - run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: soloops
          DB_USERNAME: soloops
          DB_PASSWORD: soloops_ci_only
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/pint --test
      - run: composer audit

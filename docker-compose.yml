name: soloops
services:
  app:
    build: .
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: soloops
      DB_USERNAME: soloops
      DB_PASSWORD: ${DB_PASSWORD}
  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: soloops
      MARIADB_USER: soloops
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: ["soloops_db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  soloops_db:
